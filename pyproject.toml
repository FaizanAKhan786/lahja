[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lahja"
version = "1.0.0"
description = "Gulf Arabic dialect LLM pipeline: QLoRA fine-tuning, evaluation, quantization, and serving"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Faizan Ahmed Khan" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.46",
    "datasets>=2.19",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
gguf = ["llama-cpp-python>=0.2.79"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
